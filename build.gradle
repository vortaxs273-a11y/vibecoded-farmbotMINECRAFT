plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// Baritone does the walking, digging and ore mining. It's a runtime mod dependency (players install the jar);
// we only compile against it.
def baritoneJar = file("libs/baritone-api-fabric-${project.baritone_version}.jar")
if (!baritoneJar.exists()) {
	baritoneJar.parentFile.mkdirs()
	new URL("https://github.com/cabaletta/baritone/releases/download/v${project.baritone_version}/baritone-api-fabric-${project.baritone_version}.jar")
		.withInputStream { i -> baritoneJar.withOutputStream { it << i } }
}

dependencies {
	compileOnly files(baritoneJar)
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
